name: Update F-Droid Repository

# Self-hosted Grablytic F-Droid repo (https://onlyxianzo.github.io/grablytic-fdroid/).
# Moved to repo root: GitHub Actions only runs workflows from .github/workflows/
# at the repository root (Priya's draft lived under a nested dir and never ran).
# Triggers: schedule (daily), manual dispatch, or repository_dispatch 'new-release'
# sent by OnlyXianzo/Grablytic on every published release.

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-repo:
    name: Build and Sign F-Droid Index
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        # NOTE: Ubuntu's apt fdroidserver ships an androguard too old to parse
        # AGP 8+/Flutter resources.arsc (ResParserError: res1 must be zero).
        # pip tracks upstream, which handles modern APKs.
        run: |
          pip install --upgrade fdroidserver
          fdroid --version

      - name: Download latest APKs from Grablytic
        run: |
          mkdir -p repo
          gh release download v0.0.1 --repo OnlyXianzo/Grablytic --pattern "*.apk" --dir repo/ --clobber
          # The 458 MB universal APK stays on GitHub Releases only: F-Droid
          # clients resolve per-ABI builds, and Pages caps sites at 1 GB
          # (git pushes additionally cap single files at 100 MB).
          rm -f repo/*universal*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore signing keystore
        # NOTE: `secrets.*` is not allowed in a step-level `if:` expression
        # (workflow fails validation), so the presence check lives in shell.
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FDROID_KEYSTORE_BASE64" ]; then
            echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "::notice::FDROID_KEYSTORE_BASE64 not set — index will be unsigned."
          fi

      - name: Update F-Droid index (signed when keystore present)
        # Modern fdroidserver refuses to publish unsigned indexes, so without
        # a keystore this fails fast with directions (see README "Signing").
        # Passwords come from secrets and are stripped from config.yml before
        # deploy so they never reach the public Pages branch.
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          if [ -f keystore.jks ]; then
            cp config.yml config.yml.bak
            printf '\nkeystorepass: "%s"\nkeypass: "%s"\n' \
              "$FDROID_KEYSTORE_PASS" "$FDROID_KEYSTORE_PASS" >> config.yml
            fdroid update --create-metadata
            mv config.yml.bak config.yml
            # Never publish the private key or scratch state to Pages:
            rm -f keystore.jks
            rm -rf tmp
          else
            echo "::error::FDROID_KEYSTORE_BASE64 secret not set — refusing to publish an unsigned index. One-time setup: see README 'Signing the repository', then re-run."
            exit 1
          fi

      - name: Stage Pages site (public files only)
        # upload-pages-artifact ships a whole directory: stage exactly what
        # clients need so .git, workflows, keystore and scratch never upload.
        run: |
          mkdir -p site
          cp -r repo metadata config.yml icon.png README.md site/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: update-repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
