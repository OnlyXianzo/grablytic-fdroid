name: Update F-Droid Repository

# Self-hosted Grablytic F-Droid repo (https://onlyxianzo.github.io/grablytic-fdroid/).
# Moved to repo root: GitHub Actions only runs workflows from .github/workflows/
# at the repository root (Priya's draft lived under a nested dir and never ran).
# Triggers: schedule (daily), manual dispatch, or repository_dispatch 'new-release'
# sent by OnlyXianzo/Grablytic on every published release.

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-repo:
    name: Build and Sign F-Droid Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        # NOTE: Ubuntu's apt fdroidserver ships an androguard too old to parse
        # AGP 8+/Flutter resources.arsc (ResParserError: res1 must be zero).
        # pip tracks upstream, which handles modern APKs.
        run: |
          pip install --upgrade fdroidserver
          fdroid --version

      - name: Download latest APKs from Grablytic
        run: |
          mkdir -p repo
          gh release download v0.0.1 --repo OnlyXianzo/Grablytic --pattern "*.apk" --dir repo/ --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore signing keystore
        # NOTE: `secrets.*` is not allowed in a step-level `if:` expression
        # (workflow fails validation), so the presence check lives in shell.
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FDROID_KEYSTORE_BASE64" ]; then
            echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "::notice::FDROID_KEYSTORE_BASE64 not set — index will be unsigned."
          fi

      - name: Update F-Droid index (signed when keystore present)
        run: |
          if [ -f keystore.jks ]; then
            fdroid update --create-metadata
          else
            echo "::warning::FDROID_KEYSTORE_BASE64 not set — publishing UNSIGNED index (clients will warn). Add secret to sign."
            fdroid update --create-metadata --nosign
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
